apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-demo-inventory-code
  namespace: otel-demo
data:
  requirements.txt: |
    flask==3.1.3
    opentelemetry-distro==0.66b0
    opentelemetry-exporter-otlp-proto-http==1.45.0
  app.py: |
    import random
    import time

    from flask import Flask, jsonify
    from opentelemetry import trace

    app = Flask(__name__)
    tracer = trace.get_tracer("otel-demo-inventory")

    @app.route("/stock")
    def stock():
        with tracer.start_as_current_span("check_stock") as span:
            delay = random.uniform(0.005, 0.15)
            span.set_attribute("inventory.delay_seconds", delay)
            time.sleep(delay)
            if random.random() < 0.1:
                span.set_attribute("inventory.error", True)
                return jsonify(error="inventory backend unavailable"), 500
            return jsonify(sku="WIDGET-1", quantity=random.randint(0, 100))

    @app.route("/healthz")
    def healthz():
        return jsonify(status="ok")

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-demo-inventory
  namespace: otel-demo
  labels:
    app: otel-demo-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-demo-inventory
  template:
    metadata:
      labels:
        app: otel-demo-inventory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # Buildless zero-code auto-instrumentation: a stock python image, our code
      # mounted from a ConfigMap, and OTel SDK + instrumentation packages installed
      # into a shared emptyDir at pod start. No Dockerfile, no image build/push.
      initContainers:
        - name: install-otel
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir --prefix=/otel-pkgs -r /code/requirements.txt
              # opentelemetry-bootstrap shells out to its own `pip install` to add
              # the auto-detected instrumentation packages (flask, requests...).
              # That subprocess does NOT inherit --prefix, so without PIP_PREFIX it
              # writes into this init container's own (non-shared) site-packages
              # and the main container never sees it - only the explicit --prefix
              # install above would survive via the shared emptyDir.
              export PIP_PREFIX=/otel-pkgs
              PATH="/otel-pkgs/bin:$PATH" \
              PYTHONPATH="/otel-pkgs/lib/python3.12/site-packages" \
                opentelemetry-bootstrap -a install
          volumeMounts:
            - name: code
              mountPath: /code
            - name: otel-pkgs
              mountPath: /otel-pkgs
      containers:
        - name: app
          image: python:3.12-slim
          command: ["opentelemetry-instrument", "python", "/code/app.py"]
          env:
            - name: PATH
              value: "/otel-pkgs/bin:/usr/local/bin:/usr/bin:/bin"
            - name: PYTHONPATH
              value: "/otel-pkgs/lib/python3.12/site-packages"
            - name: OTEL_SERVICE_NAME
              value: otel-demo-inventory
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=otel-demo,deployment.environment.name=dev"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: code
              mountPath: /code
            - name: otel-pkgs
              mountPath: /otel-pkgs
      volumes:
        - name: code
          configMap:
            name: otel-demo-inventory-code
        - name: otel-pkgs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-demo-inventory
  namespace: otel-demo
spec:
  selector:
    app: otel-demo-inventory
  ports:
    - port: 8080
      targetPort: 8080
