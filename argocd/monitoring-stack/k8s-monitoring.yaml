apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: monitoring-stack
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 4.1.5
    helm:
      values: |
        cluster:
          name: kind-myplatform

        grafana:
          namespace: grafana
          deployDashboards: true

        destinations:
          prometheus:
            type: prometheus
            url: http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write
          loki:
            type: loki
            url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push
          tempo:
            type: otlp
            url: http://tempo.tempo.svc.cluster.local:4317
          pyroscope:
            type: pyroscope
            url: http://pyroscope.pyroscope.svc.cluster.local:4040

        # Kubernetes object state metrics (kube-state-metrics) + kubelet/cAdvisor
        clusterMetrics:
          enabled: true
          collector: alloy-singleton

        # Node-level OS metrics (CPU/memory/disk) + energy usage
        hostMetrics:
          enabled: true
          collector: alloy-metrics
          # linuxHosts is the actual CPU/memory/disk collector - defaults to
          # disabled even when hostMetrics.enabled is true
          linuxHosts:
            enabled: true
          energyMetrics:
            enabled: true

        # Kubernetes cost allocation via OpenCost
        costMetrics:
          enabled: true
          collector: alloy-singleton
          opencost:
            labelMatchers:
              app.kubernetes.io/name: opencost

        # Extra workloads Alloy deploys itself to have something to scrape
        telemetryServices:
          kube-state-metrics:
            deploy: true
          node-exporter:
            deploy: true
          opencost:
            deploy: true
            metricsSource: prometheus
            opencost:
              exporter:
                defaultClusterId: kind-myplatform
              prometheus:
                external:
                  url: http://prometheus-operated.monitoring.svc.cluster.local:9090
          kepler:
            deploy: true

        # Scrapes pods carrying prometheus.io/scrape annotations
        annotationAutodiscovery:
          enabled: true
          collector: alloy-metrics

        # Re-scrape targets defined by ServiceMonitor/PodMonitor CRs
        prometheusOperatorObjects:
          enabled: false
          collector: alloy-metrics

        # Pre-built scrapers for common services (etcd, cert-manager, etc.)
        integrations:
          enabled: true
          collector: alloy-metrics

        # Kubernetes events forwarded as logs
        clusterEvents:
          enabled: true
          collector: alloy-singleton

        # Node-level system/journal logs
        nodeLogs:
          enabled: true
          collector: alloy-logs

        # Container logs shipped to Loki
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs

        # Container logs shipped via OTLP instead of Loki
        podLogsViaOpenTelemetry:
          enabled: false

        # Log collection driven by PodLogs CRs
        podLogsObjects:
          enabled: true
          collector: alloy-logs

        # Container logs pulled via the Kubernetes API instead of node disk
        podLogsViaKubernetesApi:
          enabled: false

        # OTLP receiver for traces/metrics/logs emitted directly by apps
        applicationObservability:
          enabled: false

        # Webhook injection of OTel auto-instrumentation into app pods
        autoInstrumentation:
          enabled: false

        # pprof profile collection for Pyroscope
        profiling:
          enabled: true
          collector: alloy-profiles
          ebpf:
            enabled: false
          java:
            enabled: false
          pprof:
            enabled: true

        # OTLP receiver for profiles pushed directly by apps
        profilesReceiver:
          enabled: true
          collector: alloy-profiles

        # The underlying Alloy instances and their roles
        collectors:
          alloy-metrics:
            enabled: true
            alloy:
              clustering:
                enabled: true
          alloy-logs:
            enabled: true
            controller:
              type: daemonset
            alloy:
              mounts:
                varlog: true
              clustering:
                enabled: true
          alloy-singleton:
            enabled: true
            alloy:
              clustering:
                enabled: true
          alloy-profiles:
            enabled: true
            alloy:
              clustering:
                enabled: true
          alloy-receiver:
            enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
