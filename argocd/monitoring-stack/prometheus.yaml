apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: monitoring-stack
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.2
    helm:
      values: |
        grafana:
          enabled: false
          forceDeployDashboards: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL

        kubelet:
          enabled: false

        nodeExporter:
          enabled: false

        kubeStateMetrics:
          enabled: false

        # Alloy's clusterMetrics.controlPlane covers these (apiserver, scheduler,
        # controller-manager, coredns, kube-proxy). etcd stays here - Alloy's
        # integrations.etcd needs extra TLS client-cert config we haven't set up.
        kubeApiServer:
          enabled: false

        kubeControllerManager:
          enabled: false

        kubeScheduler:
          enabled: false

        coreDns:
          enabled: false

        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            retention: 7d
            ruleSelector: {}
            ruleNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi

        alertmanager:
          enabled: true
          alertmanagerSpec:
            alertmanagerConfigSelector:
              matchLabels:
                alertmanagerConfig: monitoring
            alertmanagerConfigNamespaceSelector:
              matchLabels: {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
