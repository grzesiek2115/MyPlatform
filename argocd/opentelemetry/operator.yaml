apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
spec:
  destination:
    namespace: opentelemetry
    server: https://kubernetes.default.svc
  project: monitoring-stack
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.88.7
    helm:
      values: |
        manager:
          collectorImage:
            repository: otel/opentelemetry-collector-contrib
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

        # cert-manager nie jest wymagany - operator generuje certyfikaty sam
        admissionWebhooks:
          certManager:
            enabled: false
          autoGenerateCert:
            enabled: true

        crds:
          create: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
